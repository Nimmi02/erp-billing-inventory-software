<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP Billing & Inventory Software</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>
    <section class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="login-role-selector">
                    <button type="button" 
                    class="role-btn active-role"
                    id="userRole">
                    User Login
                </button>
                <button type="button"
                class="role-btn"
                id="adminRole">
                Admin Login
            </button>
        </div>
                <h2>Welcome Back</h2>
                <p>
                    Login to manage billing, inventory and business accounting.
                </p>
            </div>
            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input id="email" type="email"
                        placeholder="Enter your email" required>
                </div>
                <div class="input-group password-field">
                    <label>Password</label>
                    <input id="password" type="password" placeholder="Enter password" required>
                    <span class="toggle-password">
                        Show
                    </span>
                </div>
                <div class="login-options">
                    <div class="remember-option">
                        <input type="checkbox" id="remember">
                        <label for="remember">
                            Remember Me
                        </label>
                    </div>
                    <a href="" class="forgot-link">
                        Forgot Password?
                    </a>
                </div>
                <button
                type="submit"
                class="login-btn"
                id="loginBtn">
                Login Account
            </button>
            </form>
            <div class="signup-link">

            <p>
                    Don’t have an account?
                    <a href="./register.html">
                        Create Account
                    </a>
                </p>
            </div>
        </div>
    </section>
    <script src="../scripts/login.js"></script>
</body>
</html>
